[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "summit-scanner"
version = "2.1.0"
description = "Summit - open-source web security testing platform (proxy, scanner, fuzzer) by Pennacle Security"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pennacle Security" }]
dependencies = ["requests>=2.31", "pyyaml>=6.0", "packaging>=23.0"]

[project.optional-dependencies]
proxy = ["cryptography>=42.0"]

[project.scripts]
summit = "summit.cli:main"

[tool.setuptools.packages.find]
include = ["summit*"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
# The "warnings" set: pycodestyle errors/warnings + pyflakes.
select = ["E", "F", "W"]

[tool.ruff.lint.isort]
known-first-party = ["summit"]
