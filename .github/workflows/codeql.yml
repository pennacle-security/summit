name: codeql
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 3"
jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Check out code
        # actions/checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up CodeQL
        # github/codeql-action/init@v4.38.3
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: python
      - name: Autobuild
        # github/codeql-action/autobuild@v4.38.3
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d
      - name: Analyze
        # github/codeql-action/analyze@v4.38.3
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: "/language:python"
