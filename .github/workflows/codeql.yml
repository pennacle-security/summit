name: codeql
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 3"
jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Check out code
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up CodeQL
        # github/codeql-action/init@v4.38.3
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: python
      - name: Autobuild
        # github/codeql-action/autobuild@v4.38.3
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d
      - name: Analyze
        # github/codeql-action/analyze@v4.38.3
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: "/language:python"
