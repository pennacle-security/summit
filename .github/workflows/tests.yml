name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -e .[proxy] pytest ruff
      - run: ruff check summit tests
      - run: pytest -q
      - name: demo scan smoke test (detection must keep finding the seeded issues)
        run: |
          python examples/vuln_app.py &
          APP_PID=$!
          sleep 2
          summit scan http://127.0.0.1:8765 --depth 1 --max-pages 20 --workers 8 --rate 50 --retries 1 --json demo.json
          kill $APP_PID
          python - <<'EOF'
          import json
          data = json.load(open("demo.json"))
          total = data["total"]
          check_ids = {finding["check_id"] for finding in data["findings"]}
          expected = {"sqli-error", "sqli-boolean", "xss-reflection", "open-redirect", "path-traversal", "linkcheck-dead-domain", "waf-bypass", "waf-detected", "captcha-challenge", "takeover-signature", "host-header-injection", "cors-reflection", "os-command-injection", "ssti", "crlf-injection", "sensitive-file", "graphql-introspection", "csrf-missing"}
          missing = expected - check_ids
          assert not missing, f"demo scan missed seeded checks: {missing}"
          # negative control: the healthy https://example.com link itself must NOT
          # be flagged (match the link exactly - the open-redirect finding's URL
          # legitimately contains "example.com" as a parameter value)
          fp = [f["url"] for f in data["findings"] if f["url"].startswith("https://example.com")]
          assert not fp, f"false positives on the healthy control link: {fp}"
          print(f"demo scan OK: {total} findings, all seeded checks detected, zero false positives")
          EOF
      - name: evidence runner (every README claim must still hold)
        run: python examples/evidence.py
