name: build-binaries
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            artifact: summit-linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: summit-linux-arm64
          - os: windows-latest
            target: windows-amd64
            artifact: summit-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: Build binary
        run: |
          pyinstaller --onefile --name summit-${{ matrix.target }} --paths . --hidden-import=summit.scan.modules --hidden-import=summit.report summit/__main__.py
      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/${{ matrix.artifact }}
          asset_name: ${{ matrix.artifact }}
          asset_content_type: application/octet-stream
