name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$VER\"/" pyproject.toml
          echo "Publishing version $VER"

      - name: Skip if version is already on PyPI
        id: version_check
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          fi
          if curl -fsSL "https://pypi.org/pypi/summit-scanner/$VER/json" -o /dev/null 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VER is already on PyPI - skipping upload (duplicate trigger)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $VER is not on PyPI yet - proceeding"
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        if: steps.version_check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # No token needed: uses GitHub OIDC trusted publishing.
        # Token fallback instead: create a PYPI_API_TOKEN secret and add:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
