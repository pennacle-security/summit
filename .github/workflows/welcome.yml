name: welcome
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      # actions/first-interaction@v1
      - uses: actions/first-interaction@a1db7729b356323c7988c20ed6f0d33fe31297be
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to summit, and thank you for opening your first issue! :wave:

            A few pointers while we look at it:
            - detection quality reports (false positives / false negatives) get priority - they are first-class bugs here
            - if it is a question, our Q&A discussion is usually faster: https://github.com/pennacle-security/summit/discussions
            - `good first issue` tasks with step-by-step instructions live on the label page: https://github.com/pennacle-security/summit/labels/good%20first%20issue

            We are glad you are here.
          pr-message: |
            Thanks for your first pull request! :tada:

            What happens next:
            1. CI runs pytest, the demo-scan smoke test and the evidence runner - all three must pass
            2. a maintainer reviews, usually within a couple of days
            3. PRs are squash-merged with a clean message

            If CI is red, click the failing check - the evidence runner output explains most failures in plain text. Questions? Q&A discussion: https://github.com/pennacle-security/summit/discussions
